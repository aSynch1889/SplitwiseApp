name: SplitwiseApp
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
    - zh-Hant
    - ja
    - ko

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SplitwiseApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SplitwiseApp
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splitwise.ios.app
        PRODUCT_NAME: SplitwiseApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SplitwiseApp/App/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    scheme:
      testTargets:
        - SplitwiseAppTests
      storeKitConfigurationPath: SplitwiseApp/Resources/StoreKit.storekit

  SplitwiseAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SplitwiseAppTests
    dependencies:
      - target: SplitwiseApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.splitwise.ios.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SplitwiseApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SplitwiseApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
